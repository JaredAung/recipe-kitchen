[project]
name = "recipe-kitchen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JaredAung", email = "133064427+JaredAung@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apify-client>=3.1.3",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
recipe-kitchen = "recipe_kitchen:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
