[project]
name = "recipe-kitchen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JaredAung", email = "133064427+JaredAung@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apify-client>=3.1.3",
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
recipe-kitchen = "recipe_kitchen:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["benchmark"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "B"]
ignore = [
    "B008",  # FastAPI File()/Depends() defaults
    "UP012",  # `.encode("utf-8")` is explicit and fine
]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["benchmark"]
reportMissingTypeStubs = false
